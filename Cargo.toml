[package]
name = "totp-axum-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
axum-valid = "0.25.0"
dotenvy = "0.15.7"
serde = { version = "1.0.229" , features = ["derive"]}
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [ "postgres", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2" , features = ["full"]}
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version="0.3.23", features = ["env-filter"] }
validator = { version = "0.21.0",  features = ["derive"] }
